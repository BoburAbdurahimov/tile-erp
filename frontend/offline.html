<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1727" />
  <title>Kafel Zavodi ERP</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 20px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 20px; max-width: 380px; width: 100%; padding: 32px 28px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 20px; color: #0f172a; margin: 18px 0 8px; }
    p { font-size: 14px; color: #64748b; margin: 0 0 4px; line-height: 1.5; }
    button { margin-top: 22px; width: 100%; padding: 13px; background: #2563eb; color: #fff; border: none;
             border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/static/icons/icon-192.png" alt="" />
    <h1>Internet aloqasi yo'q</h1>
    <p>Kafel Zavodi ERP ishlashi uchun internet kerak. Aloqani tekshirib, qayta urinib ko'ring.</p>
    <p>Нет подключения к интернету. Проверьте связь и повторите попытку.</p>
    <button type="button" onclick="location.reload()">Qayta urinish / Повторить</button>
  </div>
</body>
</html>
