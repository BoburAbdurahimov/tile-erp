[project]
name = "tile-erp"
version = "1.0.0"
description = "Ceramic tile factory ERP - web dashboard and Telegram Mini App"
requires-python = ">=3.12"

# What Vercel installs. The Telegram bot runs here too (webhook), so it needs
# python-telegram-bot, and Pillow for the table / Ombor images it sends.
dependencies = [
    "fastapi>=0.110.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.4",
    "httpx>=0.27.0",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3",
    "psycopg2-binary>=2.9.9",
    "libsql-client>=0.3.1",
    "python-telegram-bot>=21.0",
    "Pillow>=10.0.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
